server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints generated bundles as name-<hash>.js/css. Cache only
    # those; copied public files keep the default revalidation behaviour.
    # (No add_header here, so the server-level security headers still apply.)
    location ~* ^/assets/.+-[A-Za-z0-9_-]+\.(js|css)$ {
        try_files $uri =404;
        expires 1y;
    }

    # Security headers
    add_header Content-Security-Policy "frame-ancestors 'self';" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;
}
